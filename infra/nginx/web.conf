# Реальный IP клиента: туннель Cloudflare несёт его в CF-Connecting-Ip.
# $proxy_add_x_forwarded_for ДОПИСЫВАЕТ клиентский XFF — спуфинг заголовком
# обходил IP-rate-limit и подделывал IP в аудите (аудит #123). Без туннеля
# (локальный доступ) fallback — адрес соединения.
map $http_cf_connecting_ip $nodus_xff {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# ONLYOFFICE (#138): соединение апгрейдится для канала ко-эдитинга (/doc/).
map $http_upgrade $oo_connection {
    default upgrade;
    ""      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Базовые security-заголовки (аудит #123): TLS терминирует туннель, HSTS
  # уйдет браузеру через него. CSP не задан осознанно (SPA + WS-гейтвей —
  # отдельное решение), rest-набор закрывает кликджекинг/MIME-сниффинг.
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header X-Frame-Options 'SAMEORIGIN' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;

  # REST API (I2)
  location /api/ {
    proxy_pass http://nodus_api:3001;
    # Вложения чата (#57): дефолт nginx 1 МБ срезал бы загрузку на корню;
    # 200m = жёсткий потолок хранилища (ADR-0013), чат режет свой лимит сам.
    client_max_body_size 200m;
    # Медленные аплоады (файл на слабом исходящем канале): не рвать соединение
    # на дефолтных 60с — тело читается минутами, ответ стримится столько же.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket gateway
  location /socket.io/ {
    proxy_pass http://nodus_gateway:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ONLYOFFICE Docs (#138): движок просмотра офисных вложений. DS проксируется
  # КОРНЕВЫМИ путями (api.js строит абсолютные /web-apps/..., канал ко-эдитинга
  # /doc/... — субпаст ломает редиректы DS; research #138, паттерн
  # ONLYOFFICE/document-server-proxy, вариант «virtual path by root»).
  # /info/, /internal/ и админпанель DS не мапятся (и сами DS-nginx режет их
  # по 127.0.0.1). Вебсокет — только /doc/; заголовки апгрейда на всём блоке
  # безвредны. Длинный read-таймаут — стриминг документа и long-poll канала.
  location ~ ^/(web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries|cache|doc|converter|command|docbuilder|welcome|healthcheck)(/|$) {
    proxy_pass http://nodus_documentserver;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oo_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 100m;
  }

  # SPA-фолбэк: все нефайловые маршруты — на index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
