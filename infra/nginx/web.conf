# Реальный IP клиента: туннель Cloudflare несёт его в CF-Connecting-Ip.
# $proxy_add_x_forwarded_for ДОПИСЫВАЕТ клиентский XFF — спуфинг заголовком
# обходил IP-rate-limit и подделывал IP в аудите (аудит #123). Без туннеля
# (локальный доступ) fallback — адрес соединения.
map $http_cf_connecting_ip $nodus_xff {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# ONLYOFFICE (#138): соединение апгрейдится для канала ко-эдитинга (/doc/).
map $http_upgrade $oo_connection {
    default upgrade;
    ""      close;
}

# Схема оригинального запроса для DS (#138): nodus.by за Cloudflare tunnel,
# cloudflared НЕ ставит X-Forwarded-Proto — documentserver строит абсолютные
# ссылки (кэш документа, Editor.bin) от увиденной схемы http://, браузер на
# HTTPS-странице режет их как Mixed Content → редактор падает (-1, «Редактор
# недоступен», репро 29.09 вечером). Edge Cloudflare всегда шлёт CF-Visitor;
# иначе passthrough XFP; прямой http-доступ — пусто (= схема соединения).
map $http_cf_visitor $nodus_proto {
    default $http_x_forwarded_proto;
    ~*https  https;
}

# Схема манифеста оболочки (#263): latest.json хранит ОТНОСИТЕЛЬНЫЕ url
# (переносимость между порталами), nginx абсолютизирует их на раздаче —
# за туннелем это https (см. $nodus_proto), при прямом входе — схема
# соединения (http в ЛВС без TLS). СТРОГИЕ match: сырой X-Forwarded-Proto
# в ответ не попадает — произвольные строки из заголовка не инъектируются
# в тело манифеста (security-аудит #263).
map $nodus_proto $desktop_scheme {
    ~^https$ https;
    ~^http$  http;
    default  $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # .mjs отсутствует в mime.types nginx (<1.27): pdf.js-воркер грузится как
  # ES-модуль, браузер требует строгий JS-MIME — иначе «Expected a
  # JavaScript-or-Wasm module script» и PDF-просмотр падает на проде
  # (репро 29.09, #138; vite preview отдаёт верный MIME — песочница не ловила).
  location ~* \.mjs$ {
    default_type text/javascript;
    try_files $uri =404;
  }

  # Базовые security-заголовки (аудит #123): TLS терминирует туннель, HSTS
  # уйдет браузеру через него. CSP не задан осознанно (SPA + WS-гейтвей —
  # отдельное решение), rest-набор закрывает кликджекинг/MIME-сниффинг.
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header X-Frame-Options 'SAMEORIGIN' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;

  # REST API (I2)
  location /api/ {
    proxy_pass http://nodus_api:3001;
    # Вложения чата (#57): дефолт nginx 1 МБ срезал бы загрузку на корню;
    # 200m = жёсткий потолок хранилища (ADR-0013), чат режет свой лимит сам.
    client_max_body_size 200m;
    # Медленные аплоады (файл на слабом исходящем канале): не рвать соединение
    # на дефолтных 60с — тело читается минутами, ответ стримится столько же.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket gateway
  location /socket.io/ {
    proxy_pass http://nodus_gateway:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $nodus_proto;
  }

  # ONLYOFFICE Docs (#138): движок просмотра офисных вложений. DS проксируется
  # КОРНЕВЫМИ путями (api.js строит абсолютные /web-apps/..., канал ко-эдитинга
  # /doc/... — субпаст ломает редиректы DS; research #138, паттерн
  # ONLYOFFICE/document-server-proxy, вариант «virtual path by root»).
  # /info/, /internal/ и админпанель DS не мапятся (и сами DS-nginx режет их
  # по 127.0.0.1). Вебсокет — только /doc/; заголовки апгрейда на всём блоке
  # безвредны. Длинный read-таймаут — стриминг документа и long-poll канала.
  # Версионный префикс /<версия>-<хэш>/... — 302-редиректы DS для кэш-бастинга статики.
  location ~ ^/((web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries|cache|doc|converter|command|docbuilder|welcome|healthcheck)|[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+)(/|$) {
    proxy_pass http://nodus_documentserver;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oo_connection;
    # Host с ПОРТОМ ($http_host, не $host): DS строит абсолютные ссылки
    # (Editor.bin в /cache, колбэки) от увиденного хоста — без порта ссылки
    # уходят на :80 и бьются мимо портала (механизм getBaseUrl у DS, #138).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    # $nodus_proto, НЕ $scheme: nginx за cloudflared всегда видит http —
    # DS строил http-ссылки и HTTPS-браузер резал их как Mixed Content.
    proxy_set_header X-Forwarded-Proto $nodus_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 100m;
  }

  # Десктоп-оболочка (#254, ADR-0019): манифест и установщики раздаёт сам
  # сервер портала (I11: без GitHub/внешнего облака). no-cache: манифест
  # маленький и должен быть свежим сразу после выкладки артефактов.
  location /desktop/ {
    alias /usr/share/nginx/desktop/;
    # add_header сервера не наследуется при своих add_header в location —
    # повторяем security-набор (аудит #254, security-reviewer).
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control 'no-cache' always;
    # Абсолютизация url манифеста (#263): tauri-plugin-updater требует
    # абсолютные URL, а latest.json один на все порталы — переписываем
    # относительные пути под домен/схему ЭТОГО входа (переменные в
    # sub_filter поддержаны с nginx 1.9.4). Минифицированный JSON из
    # scripts/desktop-manifest.mjs — паттерн матчится как есть.
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter '"url":"/desktop/' '"url":"$desktop_scheme://$http_host/desktop/';
    try_files $uri =404;
  }

  # Сборочные ассеты с хэшем в имени (vite): содержимое неизменяемо —
  # кэшируем навсегда. add_header сервера не наследуется при своих
  # add_header — повторяем security-набор (аудит #254, security-reviewer).
  location /assets/ {
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  # SPA-фолбэк: все нефайловые маршруты — на index.html. no-cache — ВСЕГДА
  # перепроверять (304 пока не изменился): без него WebView2/браузеры держали
  # страницу по эвристике — после деплоя оболочка показывала СТАРУЮ сборку
  # сколь угодно долго (фидбек 09.10 #263: «кнопки нет после 10 restarts»).
  location / {
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control 'no-cache' always;
    try_files $uri $uri/ /index.html;
  }
}
