packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

# Принудительные версии транзитивных зависимостей (pnpm audit, CI gate high/critical):
# deepmerge-ts <8 (GHSA-ggr8-5vv4-36mx) и mysql2 <3.22 (GHSA-3f6p-5ww8-9rcr) —
# приходят из prisma CLI (dev tooling, mysql2 мы не используем вовсе).
overrides:
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  # undici high (GHSA-xjj6-f33q-929c: DoS через content-encodings, 15.10;
  # до того GHSA-rfgv-xxqx-mfg5 и др., 30.09): прямая зависимость api + транзитивно
  # из vitest/jsdom (8.x) и shadcn/@dotenvx (7.x) — селективно, без смены мейджора.
  undici@>=8.0.0: 8.12.2
  undici@<8.0.0: 7.30.1
  # brace-expansion high (DoS рекурсией, 09.2026) + moderate GHSA-q2hr-2g5m-vwhr
  # (квадратичная развёртка `{a},b}`, патч 5.0.12): транзитивно из eslint/minimatch
  # и @fastify/static>glob (рантайм api, #372);
  # engine.io 6.6.9 → 6.6.10 (Socket.IO DoS, патч мажора — транзитивный из gateway).
  brace-expansion@>=4.0.0: 5.0.12
  engine.io@>=6.6.0: 6.6.10
  # proxy-addr critical (IP spoofing через v4-mapped, 10.2026) и source-map-js
  # high (event-loop DoS, 10.2026): транзитивно из shadcn CLI (ui-инструментарий,
  # не рантайм прода) — свежие advisories блокировали CI-аудит всех веток (#212).
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # body-parser high (GHSA-27r3-jxmh-p828: DoS trailing bytes после сжатого тела,
  # 22.10.2026): транзитивно из shadcn CLI > @modelcontextprotocol/sdk > express —
  # dev-инструментарий, не рантайм прода. Патч свежий (2.4.0), альтернатива — ignore.
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  # @modelcontextprotocol/sdk high (GHSA-6qxp-vccf-f47h: OAuth-клиент может
  # слить креды на сервер авторизации, выбранный MCP-сервером, 10.2026):
  # транзитивно из shadcn CLI (ui-инструментарий, не рантайм прода) — блокировал
  # CI-аудит (#221, 06.10).
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.32.1
  # handlebars critical GHSA-8r5x-fm3f-whwj / GHSA-p8wg-vrv2-v86f + moderate
  # GHSA-xw65-4hp5-5hc7: патч 4.7.10 (05.10.2026); eslint-plugin-boundaries и
  # @boundaries/elements пинят ровно 4.7.9 — патч той же линии, dev-цепочка
  # линтера (#372; снимает прежний ignore #263).
  handlebars@>=4.0.0 <4.7.10: 4.7.10

# pnpm 11: install-скрипты зависимостей блокируются, если пакет не разрешён явно.
# esbuild (транспиляция Vite/Vitest) и unrs-resolver (резолвер
# eslint-import-resolver-typescript) скачивают платформенные бинарники install-скриптами.
# prisma/@prisma/engines — CLI миграций и генерация клиента (Prisma 7).
# msw — postinstall без побочных эффектов (нужен, чтобы install не падал предупреждением).
allowBuilds:
  '@prisma/engines': true
  msw: true
  argon2: true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  '@scarf/scarf': false
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - globals@17.12.0

# Moderate через minio (рантайм api) — недостижимы, патч требует мажора
# транзитивной зависимости (#372): stream-json <3.6 (minio ^1.8) используется
# только listenBucketNotification — мы его не вызываем; decode-uri-component
# <=0.4.2 (query-string ^7) — minio только stringify, декодирования нет.
# Снять, когда minio поднимет зависимости. Гейт CI — high, игнор не нужен.
#
# Аудит зависимостей CI: braces GHSA-vfj7-8cjw-p6xm (high, патча нет —
# dev-цепочка линтера eslint-plugin-boundaries>micromatch, не рантайм)
# проигнорирован до выхода патченной версии (#187, 03.10.2026).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
