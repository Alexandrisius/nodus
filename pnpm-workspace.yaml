packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

# pnpm 10 по умолчанию блокирует install-скрипты зависимостей.
# esbuild (транспиляция Vite/Vitest) и unrs-resolver (резолвер
# eslint-import-resolver-typescript) скачивают платформенные бинарники install-скриптами.
# При переходе на pnpm 11: мигрировать на `allowBuilds` (onlyBuiltDependencies удалён).
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
