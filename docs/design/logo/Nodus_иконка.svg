<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Nodus icon: hexagonal node with three beams at exact 120° symmetry.
       Center (32,33). Endpoint circles on common circle R=23.5. All beams equal length. -->
  <g stroke="#16233A" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- beams: equal length, from hexagon vicinity into endpoint circles -->
    <line x1="32" y1="22.5" x2="32" y2="13"/>
    <line x1="22.91" y1="38.25" x2="14.68" y2="43"/>
    <line x1="41.09" y1="38.25" x2="49.32" y2="43"/>
    <!-- center hexagon, center (32,33), radius 7 -->
    <polygon points="32,26 38.06,29.5 38.06,36.5 32,40 25.94,36.5 25.94,29.5" fill="none"/>
  </g>
  <!-- endpoint circles on common circle (120° apart): top 90°, 210°, 330° -->
  <g fill="#16233A">
    <circle cx="32" cy="9.5" r="4.5"/>
    <circle cx="11.65" cy="44.75" r="4.5"/>
    <circle cx="52.35" cy="44.75" r="4.5"/>
  </g>
</svg>
