<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Nodus "O" mark: hexagon outline, inner graph perfectly centered, hollow nodes -->
  <g stroke="#16233A" fill="none" stroke-linecap="round">
    <!-- outer hexagon, center (32,32), radius 22 -->
    <polygon points="32,10 51.05,21 51.05,43 32,54 12.95,43 12.95,21" stroke-width="4"/>
    <!-- inner beams, trimmed between circle edges -->
    <g stroke-width="2.5">
      <line x1="32" y1="27.8" x2="32" y2="21"/>
      <line x1="28.36" y1="34.1" x2="22.47" y2="37.5"/>
      <line x1="35.64" y1="34.1" x2="41.53" y2="37.5"/>
    </g>
    <!-- hollow nodes -->
    <circle cx="32" cy="32" r="3.2" stroke-width="2.5"/>
    <circle cx="32" cy="18" r="3" stroke-width="2.5"/>
    <circle cx="19.88" cy="39" r="3" stroke-width="2.5"/>
    <circle cx="44.12" cy="39" r="3" stroke-width="2.5"/>
  </g>
</svg>
