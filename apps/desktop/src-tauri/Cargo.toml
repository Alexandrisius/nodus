[package]
name = "nodus-desktop"
version = "1.0.0"
description = "Nodus — десктоп-оболочка портала (тонкий клиент, ADR-0019)"
authors = ["Nodus"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "nodus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
log = "0.4"
# Конфиг-эндпоинт портала до навигации (экран подключения). native-tls =
# schannel: доверяет хранилищу сертификатов Windows, включая внутренний CA.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
