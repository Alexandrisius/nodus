# Dependabot: обновления PR-ами в main, группами, еженедельно (workflow.md).
version: 2
updates:
  - package-ecosystem: 'npm' # покрывает pnpm workspaces
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # TS 7 — миграция инструментария, не патч-бамп; отложена до «после запуска» (#75)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      github-actions:
        patterns: ['*']
