# Dependabot: обновления PR-ами в main, группами, еженедельно (workflow.md).
version: 2
updates:
  - package-ecosystem: 'npm' # покрывает pnpm workspaces
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # TS 7 — миграция инструментария, не патч-бамп; отложена до «после запуска» (#75)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Свежие мажоры дев-инструментария: миграция каждой — отдельной задачей,
      # не в еженедельной группе; зелёный CI (e2e — только логин) их не валидирует (#281)
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'msw'
        update-types: ['version-update:semver-major']
      - dependency-name: 'unplugin-swc'
        update-types: ['version-update:semver-major']
      # Типы под Node 26 при рантайме Node 24 (ci.yml) — держим линию 24; снять при подъёме рантайма (#281)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jsdom 30.1 × vitest ≤5.0.2: compat-слой vitest ищет impl Blob через
      # Symbol, jsdom 30.1 унёс его в приватное поле → URL.createObjectURL
      # падает «_buffer» (vitest#11336, не наш код). Держим 30.0.x до фикса
      # апстрима — тогда правило снять.
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # @swc/core 1.16 не грузится на Windows-хосте разработки (проверка прав
      # кэша нативного аддона, swc-project/swc#12442/#12534) — интеграционные
      # тесты не стартуют локально. Держим 1.15.x (#324); снять после
      # стабильного 1.16.19+ с проверкой `node -e "require('@swc/core')"` на хосте.
      - dependency-name: '@swc/core'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # fastify — ТОЧНЫЙ пин @nestjs/platform-fastify (12.1.3 → 5.12.5): прямой
      # fastify новее пина даёт две копии в дереве и TS2345 на регистрации
      # плагинов (#340, nestjs/nest#13607). Версию меняем вручную в PR, где
      # обновление Nest меняет пин (gotchas «Бэкенд», #367).
      - dependency-name: 'fastify'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      github-actions:
        patterns: ['*']
