name: "Баг"
description: "Дефект: ожидаемое поведение расходится с фактическим"
title: "[Баг] "
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: "Шаги воспроизведения"
      description: "Минимальная последовательность: 1) … 2) … 3) …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемое поведение"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Фактическое поведение"
      description: "Включая тексты ошибок, скриншоты, логи."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Контекст"
      description: "Браузер/клиент, пользователь/роль, окружение (dev/демо), как часто повторяется."
    validations:
      required: false
