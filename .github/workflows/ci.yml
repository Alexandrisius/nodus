name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Еженедельный аудит зависимостей (навык nestjs-best-practices: security-dependency-audit).
  schedule:
    - cron: '17 5 * * 1'

# Least-privilege (гайд GitHub «effective CI»): этому воркфлоу не нужно
# ничего, кроме чтения репозитория — токен джоб по умолчанию не может писать.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Детектор «есть ли код в дифе» (issue #23): docs-only PR пропускает тяжёлые
  # джобы — skipped job засчитывается за success обязательного check (protection
  # не блокируется, в отличие от paths-ignore, который убивает check совсем).
  # Третья полоса — «данные-only» (#412): диф только из релизных JSON «Что
  # нового» идёт в лёгкую джобу data вместо полного конвейера.
  changes:
    name: Детектор изменений кода
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          # Внешние контексты — через env, не интерполяцией в run: прямая
          # подстановка в shell — паттерн script-injection (security-ревью
          # #412). event_name — закрытый набор значений GitHub, можно напрямую.
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Еженедельный cron существует ради аудита зависимостей — он не
          # зависит от дифа последнего коммита (docs-only коммит в main
          # молча отменял аудит, #317).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "data=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          else
            # Весь пуш целиком, а не только последний коммит (security-ревью
            # #412): код в ранних коммитах мультикоммитного пуша не должен
            # ускользать от полного прогона. before обнуляется только при
            # создании ветки/force-push — для main оба запрещены protection,
            # fallback HEAD~1 оставлен для надёжности.
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
            else
              CHANGED=$(git diff --name-only HEAD~1)
            fi
          fi
          # Код = что угодно вне docs/**, *.md, .gitignore, ролей субагентов
          # (канон без исполняемого кода) и данных «Что нового» — их проверяет
          # лёгкая полоса data ниже: JSON вшиты в бандл web eager-glob, ломает
          # их только сборка web и тест-страж, не полный конвейер.
          if echo "$CHANGED" | grep -qvE -e '^docs/' -e '\.md$' -e '^\.gitignore$' -e '^\.zcode/agents/' -e '^\.agents/agents/' -e '^apps/web/src/features/whats-new/releases/[^/]+\.json$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Данные-only = кода нет, но выпуск «Что нового» в диффе есть.
          if echo "$CHANGED" | grep -qE '^apps/web/src/features/whats-new/releases/[^/]+\.json$'; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "data=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: lint → typecheck → test → build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # Реальные PG/Redis для интеграционных тестов (outbox, идемпотентность — patterns.md).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus_ci_password
          POSTGRES_DB: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Полная история — turbo affected-фильтру нужен merge-base с main (issue #23).
          fetch-depth: 0

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Межпрогонный кэш turbo (#247 Ф3): build/typecheck/test пакетов, не
      # тронутых дифом, восстанавливаются из кэша вместо пересборки с нуля.
      # Ключ по sha + restore-keys — берётся ближайший предыдущий прогон.
      - name: Кэш turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Fail-fast (гайд GitHub «effective CI»): самая дешёвая и самая частая
      # ошибка проверяется первой, секунды — до сетевого аудита и генераций.
      - name: Форматирование (prettier)
        run: pnpm format:check

      - name: Аудит зависимостей (high/critical блокируют)
        run: pnpm audit --audit-level high

      # Клиент генерируется в apps/api/src/generated (не коммитится) — нужен typecheck/тестам/сборке.
      - name: Генерация Prisma client
        run: pnpm --filter @nodus/api db:generate
        env:
          DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus

      # Type-aware правила линтера (no-floating-promises) резолвят типы
      # @nodus/contracts из dist — без сборки контрактов типы молча
      # становятся any и правило слепнет.
      - name: Сборка контрактов (типы для type-aware линтинга)
        run: pnpm --filter @nodus/contracts build

      - name: Lint (границы модулей I6, размер файлов I5, промисы)
        run: pnpm lint

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Тесты (unit + тест-кейсы правил линтера)
        # PR — affected-only по дифу с base-веткой (turbo учитывает граф зависимостей:
        # правка contracts запускает и тесты зависимых пакетов). Push в main — всегда
        # полный прогон: main проверен целиком (issue #23).
        # BASE_REF через env — не интерполяцией в shell (script-injection, security #412).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo test --filter='!@nodus/e2e' --filter="[origin/${BASE_REF}...HEAD]"
          else
            pnpm test
          fi

      # S3 SILO (#57, форк MinIO): service-контейнеры GH Actions не умеют
      # command, а CMD образа без аргумента только печатает версию — поднимаем
      # обычным docker run; api ходит root-кредами (minio-init не нужен).
      - name: Запуск S3 (SILO) для вложений (#57)
        run: |
          docker run -d --name silo -p 9000:9000             -e MINIO_ROOT_USER=nodus_ci -e MINIO_ROOT_PASSWORD=nodus_ci_secret_min8             pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 1; done'

      - name: Интеграционные тесты (outbox, идемпотентность, контракт ошибок — реальные PG/Redis)
        run: pnpm --filter @nodus/api test:integration
        env:
          DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          # Тестовый секрет (не продовый): AuthModule требует JWT_SECRET при старте.
          JWT_SECRET: ci-integration-test-secret-min-32-chars
          # S3 SILO для теста вложений чата (#57); root-креды сервиса выше.
          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: '9000'
          STORAGE_USE_SSL: 'false'
          STORAGE_ACCESS_KEY: nodus_ci
          STORAGE_SECRET_KEY: nodus_ci_secret_min8
          STORAGE_URL_SECRET: ci-storage-url-secret-min-32-chars

      # WS-gateway #104: сквозной контур (auth-хендшейк, комнаты, fanout из
      # Redis Stream, typing, presence) на тех же сервисах PG/Redis.
      - name: Интеграционные тесты gateway (WS)
        run: pnpm --filter @nodus/gateway test:integration
        env:
          DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-integration-test-secret-min-32-chars

      - name: Build
        run: pnpm build

  # Лёгкая полоса «данные-only» (#412): диф состоит только из релизных JSON
  # «Что нового» (+ docs). Оба риска этих файлов покрываются дёшево: сломанный
  # JSON-синтаксис роняет сборку web (файлы вшиты в бандл eager-glob), кривую
  # схему/имя/жаргон ловит тест-страж releases.test.ts. Эквивалент полного
  # прогона: код в дереве идентичен уже зелёному main, меняются только данные
  # (осознанное сужение «push в main — всегда полный» из #23). Релизные PR
  # (навык nodus-release) и их merge-пуши проходят здесь за минуты.
  data:
    name: Страж данных (только JSON «Что нового»)
    needs: changes
    if: needs.changes.outputs.code == 'false' && needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Fail-fast и паритет с quality: релизные JSON входят в зону prettier
      # полного прогона (не в .prettierignore) — дрейф формата, смерженный
      # лёгкой полосой, не должен ронять format:check следующего чужого
      # кодового PR (code-review #412).
      - name: Форматирование релизных JSON (prettier)
        run: pnpm exec prettier --check apps/web/src/features/whats-new/releases

      # Как в quality (#247 Ф3), но отдельный префикс ключа: набор задач другой
      # (только web), пересечение с кэшем quality джоб не критично.
      - name: Кэш turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-data-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-data-${{ runner.os }}-

      # ^build подтянет контракты, test — тест-страж данных, build — валидный
      # бандл с новым JSON: ровно те две проверки, которые нужны данным.
      - name: Тест-страж данных + сборка web
        run: pnpm turbo test build --filter=@nodus/web

  e2e:
    name: 'E2E (Playwright — критичный путь: логин)'
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus_ci_password
          POSTGRES_DB: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus
      REDIS_URL: redis://localhost:6379
      # Тестовый секрет (не продовый); COOKIE_SECURE=false — e2e ходит по http://localhost.
      JWT_SECRET: ci-e2e-test-secret-min-32-characters
      NODE_ENV: production
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка (contracts → api + web)
        run: pnpm build

      - name: Миграции и сидинг тестовой БД
        # Креды e2e-стенда — единый источник сред tests/e2e/e2e-users.json
        # (#247): его же читают спеки и сид песочницы live-stack. Сид без env
        # генерирует случайные пароли (прод).
        run: |
          export SEED_ADMIN_PASSWORD="$(node -p "require('./tests/e2e/e2e-users.json').admin.password")"
          export SEED_DEMO_PASSWORD="$(node -p "require('./tests/e2e/e2e-users.json').second.password")"
          pnpm --filter @nodus/api db:deploy && pnpm --filter @nodus/api db:seed

      # S3 SILO (#57, форк MinIO): service-контейнеры GH Actions не умеют
      # command, а CMD образа без аргумента только печатает версию — поднимаем
      # обычным docker run; api ходит root-кредами (minio-init не нужен).
      - name: Запуск S3 (SILO) для вложений (#57)
        run: |
          docker run -d --name silo -p 9000:9000             -e MINIO_ROOT_USER=nodus_ci -e MINIO_ROOT_PASSWORD=nodus_ci_secret_min8             pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 1; done'

      - name: Запуск API
        run: nohup node apps/api/dist/main.js > /tmp/nodus-api.log 2>&1 &
        env:
          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: '9000'
          STORAGE_USE_SSL: 'false'
          STORAGE_ACCESS_KEY: nodus_ci
          STORAGE_SECRET_KEY: nodus_ci_secret_min8
          STORAGE_URL_SECRET: ci-e2e-storage-url-secret-min-32-ch

      # WS-gateway (#104): тот же JWT_SECRET/PG/Redis, порт 3002 (vite preview
      # проксирует /socket.io на него по умолчанию).
      - name: Запуск WS-gateway
        run: nohup node apps/gateway/dist/main.js > /tmp/nodus-gateway.log 2>&1 &
        env:
          GATEWAY_PORT: '3002'

      - name: Запуск web (vite preview с прокси /api)
        # --host 127.0.0.1: vite preview биндит localhost (может уйти в ::1), curl идёт на IPv4.
        run: nohup pnpm --filter @nodus/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/nodus-web.log 2>&1 &

      - name: Ожидание готовности стека
        run: |
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3001/api/v1/health/ready > /dev/null; do sleep 1; done' || { echo '--- API log ---'; cat /tmp/nodus-api.log; exit 1; }
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:3002/health > /dev/null; do sleep 1; done' || { echo '--- Gateway log ---'; cat /tmp/nodus-gateway.log; exit 1; }
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:4173 > /dev/null; do sleep 1; done' || { echo '--- Web log ---'; cat /tmp/nodus-web.log; exit 1; }

      - name: Кэш браузеров Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright (chromium)
        # --with-deps ставит системные шрифты через apt (до 6 мин на медленном
        # зеркале — урок 7m27s в issue #23): только при cache miss. На hit
        # хватает системных библиотек образа ubuntu-latest (шрифты визуально
        # не проверяем — скриншоты только при падениях).
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm --filter @nodus/e2e exec playwright install --with-deps chromium
          else
            pnpm --filter @nodus/e2e exec playwright install chromium
          fi

      - name: E2E-тесты
        # Критичные пути (DoD): логин (моки), живой чат двух сессий (#104) и
        # живые вложения чата (#57 — upload→send→download на реальном MinIO).
        # graph-stress.spec — perf-харнесс для локального прогона, в CI не входит.
        run: pnpm --filter @nodus/e2e test specs/auth.spec.ts specs/chat-two-sessions-live.spec.ts specs/chat-attachments-live.spec.ts
        env:
          NODUS_BASE_URL: http://localhost:4173
          E2E_LIVE_API: '1'
          # Креды — дефолты tests/e2e/e2e-users.ts из e2e-users.json (те же, что у сида выше, #247).
