name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Еженедельный аудит зависимостей (навык nestjs-best-practices: security-dependency-audit).
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest
    services:
      # Реальные PG/Redis для интеграционных тестов (outbox, идемпотентность — patterns.md).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus_ci_password
          POSTGRES_DB: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Аудит зависимостей (high/critical блокируют)
        run: pnpm audit --audit-level high

      # Клиент генерируется в apps/api/src/generated (не коммитится) — нужен typecheck/тестам/сборке.
      - name: Генерация Prisma client
        run: pnpm --filter @nodus/api db:generate
        env:
          DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus

      - name: Lint (границы модулей I6, размер файлов I5)
        run: pnpm lint

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Тесты (unit + тест-кейсы правил линтера)
        run: pnpm test

      - name: Интеграционные тесты (outbox, идемпотентность, контракт ошибок — реальные PG/Redis)
        run: pnpm --filter @nodus/api test:integration
        env:
          DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          # Тестовый секрет (не продовый): AuthModule требует JWT_SECRET при старте.
          JWT_SECRET: ci-integration-test-secret-min-32-chars

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright — критичный путь: логин)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus_ci_password
          POSTGRES_DB: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nodus:nodus_ci_password@localhost:5432/nodus
      REDIS_URL: redis://localhost:6379
      # Тестовый секрет (не продовый); COOKIE_SECURE=false — e2e ходит по http://localhost.
      JWT_SECRET: ci-e2e-test-secret-min-32-characters
      NODE_ENV: production
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка (contracts → api + web)
        run: pnpm build

      - name: Миграции и сидинг тестовой БД
        run: pnpm --filter @nodus/api db:deploy && pnpm --filter @nodus/api db:seed

      - name: Запуск API
        run: node apps/api/dist/main.js &

      - name: Запуск web (vite preview с прокси /api)
        run: pnpm --filter @nodus/web exec vite preview --port 4173 --strictPort &

      - name: Ожидание готовности стека
        run: |
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3001/api/v1/health/ready > /dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:4173 > /dev/null; do sleep 1; done'

      - name: Playwright (chromium)
        run: pnpm --filter @nodus/e2e exec playwright install --with-deps chromium

      - name: E2E-тесты
        run: pnpm --filter @nodus/e2e test
        env:
          NODUS_BASE_URL: http://localhost:4173
