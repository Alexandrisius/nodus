name: desktop

# Десктоп-оболочка (#254, ADR-0019): сборка на windows-runner. Подписанные
# updater-артефакты собираются ТОЛЬКО при наличии секрета TAURI_SIGNING_PRIVATE_KEY
# (владелец добавляет по runbook docs/runbooks/desktop-deploy.md); без ключа —
# обычные установщики (dev-проверки), latest.json не публикуется.

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Контракты → мини-UI оболочки
        run: |
          pnpm --filter @nodus/contracts build
          pnpm --filter @nodus/desktop build

      - name: Сборка установщиков (подписанные при наличии ключа)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::Секрет TAURI_SIGNING_PRIVATE_KEY не задан — updater-артефакты пропущены (см. docs/runbooks/desktop-deploy.md)"
            pnpm exec tauri build
          fi

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: nodus-desktop-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Публикация релиза (тег desktop-v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodus-desktop-${{ github.sha }}
          path: dist

      - name: GitHub Release с установщиками и манифестом
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.sig
          generate_release_notes: true
