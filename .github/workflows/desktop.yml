name: desktop

# Десктоп-оболочка (#254, ADR-0019): build-гейт на windows-runner — сборка
# установщиков проверяется на каждый мерж, артефакты лежат в прогонах
# (retention 30 дней). НИКАКОЙ публикации установщиков на GitHub: релизы
# отсутствуют, единственный канал раздачи — свой сервер (NODUS_DESKTOP_DIR,
# /desktop/); подпись и манифест — локально при выпуске (runbook
# docs/runbooks/desktop-deploy.md). Решение владельца 16.10 (#300): релизная
# джоба и теги desktop-v* выпилены.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# Least-privilege (гайд GitHub «effective CI»): чтение репозитория; выкладка
# артефактов прогона не требует write-прав токена джобы.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri build (windows)
    runs-on: windows-latest
    steps:
      # Пины actions/* — полный SHA + комментарий версии (supply-chain hardening,
      # #412): Dependabot (github-actions, еженедельно) обновляет и SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Версия pnpm — из packageManager в package.json (как ci.yml):
      # явная version здесь конфликтовала с фиксацией и валила сборку.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Тегами остаются только эти два: rust-toolchain@stable — движущийся
      # указатель стабильного toolchain (смысл действия), rust-cache@v2 —
      # обновляется автором в рамках v2; SHA-пин лишает их назначения.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Контракты → мини-UI оболочки
        run: |
          pnpm --filter @nodus/contracts build
          pnpm --filter @nodus/desktop build

      - name: Сборка установщиков (подписанные при наличии ключа)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::Секрет TAURI_SIGNING_PRIVATE_KEY не задан — updater-артефакты пропущены (см. docs/runbooks/desktop-deploy.md)"
            pnpm exec tauri build
          fi

      - name: Манифест раздачи latest.json (#263)
        shell: bash
        run: node scripts/desktop-manifest.mjs --optional

      - name: Артефакты сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nodus-desktop-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/latest.json
          if-no-files-found: warn
          retention-days: 30
