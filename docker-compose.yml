# Dev/демо-профиль (ADR-0002): web, api, gateway, postgres, redis, s3 (SILO), gotenberg
# (+ cloudflared — опциональным профилем `tunnel`, туннель к nodus.by).
# Изоляция от чужих проектов на хосте: контейнеры/сети/тома — только с префиксом nodus_,
# порты публикуются через .env (шаблон — .env.example).
name: nodus

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Демо для руководства — концепт на моках; боевой режим — false в .env
        VITE_API_MOCK: '${NODUS_WEB_MOCK:-true}'
    container_name: nodus_web
    restart: unless-stopped
    ports:
      - '${NODUS_WEB_PORT:-3000}:80'
    volumes:
      # Десктоп-оболочка (#254): каталог артефактов (latest.json + установщики)
      # за nginx-статикой /desktop/; пусто = папка репо без артефактов.
      - '${NODUS_DESKTOP_DIR:-./infra/desktop-dist}:/usr/share/nginx/desktop:ro'
    depends_on:
      - api
      - gateway
    networks: [nodus_net]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nodus_api
    restart: unless-stopped
    environment:
      API_PORT: '3001'
      NODE_ENV: 'production'
      # IP-rate-limit пробрасывается из .env (дефолт приложения 3000/мин — офис
      # за NAT; k6-прогоны поднимают планку). Не задан — код берёт свой дефолт.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:?задайте в .env}:${POSTGRES_PASSWORD:?задайте в .env}@nodus_postgres:5432/${POSTGRES_DB:?задайте в .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?задайте в .env}@nodus_redis:6379
      JWT_SECRET: ${JWT_SECRET:?задайте в .env}
      # Файловое хранилище (#57, ADR-0013): api пишет/читает S3 (SILO)
      # сервисной учёткой minio-init (права только на бакет вложений).
      # Дефис-алиас: СЕРВЕР SILO отвергает '_' в Host (400 InvalidRequest на
      # каждый запрос — репро пересборки прода 28.09), как и клиент mcli.
      STORAGE_ENDPOINT: nodus-minio
      STORAGE_PORT: '9000'
      STORAGE_USE_SSL: 'false'
      STORAGE_BUCKET: ${STORAGE_BUCKET:-nodus-files}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?задайте в .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?задайте в .env}
      # Подпись ссылок отдачи файлов (HMAC, ADR-0013) — отдельный секрет.
      STORAGE_URL_SECRET: ${STORAGE_URL_SECRET:?задайте в .env}
      # ONLYOFFICE (#138): движок просмотра. api↔documentserver ходят по
      # внутренней сети compose (не по браузерному origin); JWT — общий секрет.
      OFFICE_ENABLED: ${OFFICE_ENABLED:-false}
      OFFICE_EDIT_ENABLED: ${OFFICE_EDIT_ENABLED:-true}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      OFFICE_INTERNAL_URL: http://documentserver
      # Дефис-алиас api (SILO-урок: подчёркивания в Host — мина).
      OFFICE_API_INTERNAL_URL: http://nodus-api:3001
      # Конвейер производных #139 (PDF-копии офисных): Gotenberg в сети.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
    ports:
      # 127.0.0.1: api/gateway доступны хосту (k6, dev-таргет) и nginx web-контейнера
      # по внутренней сети; в LAN не торчат (аудит #123, вердикт 27.09).
      - '127.0.0.1:${NODUS_API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, не localhost: в alpine localhost резолвится в ::1, а сервис слушает IPv4.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      nodus_net:
        aliases: [nodus-api]

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: nodus_gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: '3002'
      # WS-gateway (#104): HS256 тех же access-токенов, READ-ONLY Postgres
      # (членство/профили), consumer Redis Stream событий чата.
      JWT_SECRET: ${JWT_SECRET:?задайте в .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:?задайте в .env}:${POSTGRES_PASSWORD:?задайте в .env}@nodus_postgres:5432/${POSTGRES_DB:?задайте в .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?задайте в .env}@nodus_redis:6379
    ports:
      - '127.0.0.1:${NODUS_GATEWAY_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, не localhost: в alpine localhost резолвится в ::1, а сервис слушает IPv4.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nodus_net]

  postgres:
    image: postgres:18-alpine
    container_name: nodus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте в .env}
    volumes:
      # Postgres 18+: монтируем корень /var/lib/postgresql (данные — во вложенной
      # папке версии) — так будущие мажорные апгрейды возможны через pg_upgrade --link.
      - nodus_pgdata:/var/lib/postgresql
    ports:
      # Хостовому dev нужен локальный доступ — но не LAN (аудит #123).
      - '127.0.0.1:${NODUS_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nodus_net]

  redis:
    image: redis:8-alpine
    container_name: nodus_redis
    restart: unless-stopped
    # requirepass: official image выключает protected-mode, без пароля любой
    # процесс хоста/LAN мог FLUSHALL и читать стрим событий (аудит #123).
    command:
      ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?задайте в .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте в .env}
    volumes:
      - nodus_redisdata:/data
    ports:
      - '127.0.0.1:${NODUS_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nodus_net]

  # S3-хранилище: SILO — поддерживаемый форк MinIO от Pigsty (silo.pigsty.io,
  # вердикт владельца 28.09: upstream мёртв — образ RELEASE.2025-09-07 был
  # последним, репозиторий архивирован в апреле 2026). Тот же S3-API и
  # MINIO_*-env; тег обновляем осознанно за релизами (не latest).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: nodus_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?задайте в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте в .env}
    volumes:
      - nodus_miniodata:/data
    ports:
      - '127.0.0.1:${NODUS_MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${NODUS_MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      # Нативная проба форка: silo healthcheck ready (exit-код = здоровье).
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      nodus_net:
        # Алиас без подчёркивания: клиент mcli (minio-init) отвергает '_' в
        # hostname как invalid hostname — валидация URL клиента, не DNS.
        aliases: [nodus-minio]

  # Инициализация S3-хранилища (#57, ADR-0013): приватный бакет вложений +
  # сервисная учётка api с правами ТОЛЬКО на объекты (root-креды api не
  # получает). Одноразовый (restart: 'no'); api ждёт service_completed_
  # successfully. Клиент форка — mcli (mc-совместимый).
  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: nodus_minio_init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?задайте в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте в .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-nodus-files}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?задайте в .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?задайте в .env}
    entrypoint: /bin/sh
    # Идемпотентен: повторный запуск ничего не ломает (mb --ignore-existing,
    # user add — упсерт секрета существующего, attach уже висящего не ошибка).
    command:
      - -c
      - |
        set -e
        mcli alias set local http://nodus-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mcli mb --ignore-existing "local/$$STORAGE_BUCKET"
        # Права ТОЛЬКО на бакет вложений (валидация #57: ранее arn:aws:s3:::*):
        # объекты + HeadBucket (ensureBucket при буте api) + Location; бакет
        # создаёт root здесь — CreateBucket учётке не нужен.
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' "$$STORAGE_BUCKET" "$$STORAGE_BUCKET" > /tmp/nodus-storage-rw.json
        mcli admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        mcli admin policy create local nodus-storage-rw /tmp/nodus-storage-rw.json 2>/dev/null || mcli admin policy update local nodus-storage-rw /tmp/nodus-storage-rw.json
        mcli admin policy attach local nodus-storage-rw --user "$$STORAGE_ACCESS_KEY" 2>/dev/null || true
        echo 'minio-init: бакет и сервисная учётка готовы'
    networks: [nodus_net]

  # ONLYOFFICE Docs CE 9.4 (#138): движок просмотра офисных вложений.
  # Отдельный контейнер-компаньон (как SILO, не линкуемся) под profile `office`
  # — стек живёт и без него (фолбэк на скачивание). 9.4 CE: без лимита
  # соединений, один процесс, БД/Redis/RabbitMQ НЕ нужны (EE-only). Внутренние
  # вызовы api↔DS — по сети compose; наружу только через nginx портала.
  documentserver:
    image: onlyoffice/documentserver:9.4.0.1
    container_name: nodus_documentserver
    restart: unless-stopped
    profiles: [office]
    environment:
      JWT_ENABLED: 'true'
      # Общий секрет с api (#138); пустой → DS генерирует случайный при каждом
      # пересоздании (интеграция развалится) — задавайте в .env.
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'false'
      # DS скачивает файлы с api по приватным адресам внутренней сети:
      # SSRF-фильтр DS по умолчанию их режет (research #138,
      # request-filtering-agent; лечение — официальный env образа).
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'true'
      WOPI_ENABLED: 'false'
      EXAMPLE_ENABLED: 'false'
    volumes:
      - nodus_officedata:/var/www/onlyoffice/Data
      - nodus_officelogs:/var/log/onlyoffice
      - nodus_officelib:/var/lib/onlyoffice
    ports:
      # Публикуется только на loopback: прод-браузер ходит через nginx web
      # (корневые пути DS); порт нужен dev/песочнице (vite-прокси) и проверкам.
      - '127.0.0.1:${NODUS_OFFICE_PORT:-3013}:80'
    healthcheck:
      # Готовность = «true» после внутренней конвертации пробы; первый старт
      # генерирует шрифты — до 5 минут (start_period).
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/healthcheck']
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks: [nodus_net]

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: nodus_gotenberg
    restart: unless-stopped
    # Первый потребитель — конвейер производных #139: прод-api ходит по
    # docker-сети (GOTENBERG_URL=http://gotenberg:3000). Наружу — только
    # loopback-бинд для песочницы live-stack (api на хосте), не в LAN
    # (SSRF-аудит #123 сохранён).
    ports:
      - '127.0.0.1:${NODUS_GOTENBERG_PORT:-3100}:3000'
    networks: [nodus_net]

  # Туннель к nodus.by (ADR-0002): поднимается явно — `docker compose --profile tunnel up -d`.
  # Токен — из Cloudflare Zero Trust dashboard (см. docs/runbooks/repo-bootstrap.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: nodus_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${NODUS_TUNNEL_TOKEN:?задайте в .env}
    depends_on:
      - web
    networks: [nodus_net]
    profiles: [tunnel]

networks:
  nodus_net:
    name: nodus_net

volumes:
  nodus_pgdata:
    name: nodus_pgdata
  nodus_redisdata:
    name: nodus_redisdata
  nodus_miniodata:
    name: nodus_miniodata
  nodus_officedata:
    name: nodus_officedata
  nodus_officelogs:
    name: nodus_officelogs
  nodus_officelib:
    name: nodus_officelib
